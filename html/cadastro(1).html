<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livraria CLS - Cadastro</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/cadastro.css">
</head>
<body>

  <nav class="cabecalho">
    <div class="logo"><img src="../imagem/logo-cls-estante.png" alt="CLS Livraria"></div>
    <ul class="menu">
      <li><a href="index.html">Início</a></li>
      <li><a href="catalogo.html">Catálogo</a></li>
      <li><a href="foruns.html">Fórum</a></li>
      <li><a href="unidades.html">Unidades</a></li>
      <li><a href="lista_desejos.html" title="Lista de Desejos">♡</a></li>
      <li><a href="carrinho.html" title="Meu Carrinho"><img src="../imagem/carrinho.png" alt="Meu Carrinho" class="icone-menu"></a></li>
      <li><a href="login.html" class="botao-login">Login</a></li>
      <li><a href="cadastro.html" class="botao-cadastro">Cadastrar</a></li>
    </ul>
  </nav>

  <main class="centro">
    <!-- Cadastro falso -->
    <form action="login.html" class="caixa form-conta">
      <h1>CADASTRO</h1>

      <div class="campo">
        <label for="nome">Nome</label>
        <input type="text" id="nome" placeholder="Digite seu nome" required>
      </div>
      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="Digite seu e-mail" required>
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Digite sua senha" required>
      </div>
      <div class="campo">
        <label for="confirmarSenha">Confirmar senha</label>
        <input type="password" id="confirmarSenha" placeholder="Digite a senha novamente" required>
      </div>

      <button type="submit" class="botao-azul">Criar conta</button>

      <div class="rodape-form">
        Já possui uma conta? <a href="login.html">Fazer login</a>
      </div>
    </form>
  </main>

</body>
</html>
