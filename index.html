<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livraria CLS - Início</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/index.css">
  <!-- Modelo 3D -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body>

  <header class="cabecalho">
    <a href="index.html" class="logo"><img src="imagem/logo-cls-estante.png" alt="CLS Livraria - página inicial"></a>
    <nav aria-label="Menu principal">
      <ul class="menu">
        <li><a href="index.html">Início</a></li>
        <li><a href="catalogo.html">Catálogo</a></li>
        <li><a href="foruns.html">Fórum</a></li>
        <li><a href="unidades.html">Unidades</a></li>
        <li><a href="lista_desejos.html" title="Lista de Desejos" aria-label="Lista de Desejos">♡</a></li>
        <li><a href="carrinho.html" title="Meu Carrinho"><img src="imagem/carrinho.png" alt="Meu Carrinho" class="icone-menu"></a></li>
        <li><a href="login.html" class="botao-login">Login</a></li>
        <li><a href="cadastro.html" class="botao-cadastro">Cadastrar</a></li>
      </ul>
    </nav>
  </header>

  <main class="apresentacao">
    <section class="apresentacao-texto">
      <h1>Onde as letras <br><span class="destaque-texto">viram</span><br> grandes histórias.</h1>
      <p>Explore nosso catálogo através da pesquisa interativa.</p>

      <form action="catalogo.html" class="formulario-busca" role="search">
        <input type="search" name="busca" aria-label="Pesquisar livros" placeholder="Pesquise por título, autor ou gênero...">
        <button type="submit">Buscar</button>
      </form>

      <ul class="beneficios">
        <li><strong>Frete Grátis</strong><span>Acima de R$ 50</span></li>
        <li><strong>Compra Segura</strong><span>Dados protegidos</span></li>
        <li><strong>Entrega rápida</strong><span>Em até 3 dias úteis</span></li>
      </ul>
    </section>

    <div class="modelo-3d">
      <model-viewer src="https://github.com/PedroTurubia/projetoLivrariaCLS/releases/download/v1.0/livros.glb" alt="Modelo 3D de Livros Antigos" auto-rotate camera-controls shadow-intensity="1" touch-action="pan-y" camera-orbit="0deg 75deg 2m" field-of-view="30deg"></model-viewer>
    </div>
  </main>

</body>
</html>
