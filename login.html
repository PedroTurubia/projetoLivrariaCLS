<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livraria CLS - Login</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <header class="cabecalho">
    <a href="index.html" class="logo"><img src="imagem/logo-cls-estante.png" alt="CLS Livraria - página inicial"></a>
    <nav aria-label="Menu principal">
      <ul class="menu">
        <li><a href="index.html">Início</a></li>
        <li><a href="catalogo.html">Catálogo</a></li>
        <li><a href="foruns.html">Fórum</a></li>
        <li><a href="unidades.html">Unidades</a></li>
        <li><a href="lista_desejos.html" title="Lista de Desejos" aria-label="Lista de Desejos">♡</a></li>
        <li><a href="carrinho.html" title="Meu Carrinho"><img src="imagem/carrinho.png" alt="Meu Carrinho" class="icone-menu"></a></li>
        <li><a href="login.html" class="botao-login" aria-current="page">Login</a></li>
        <li><a href="cadastro.html" class="botao-cadastro">Cadastrar</a></li>
      </ul>
    </nav>
  </header>

  <main class="centro">
    <!-- Login de mentira: ao clicar em Entrar vai direto para o perfil -->
    <form action="perfil.html" class="caixa form-conta">
      <h1>LOGIN</h1>

      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" autocomplete="email" required>
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" autocomplete="current-password" required>
      </div>

      <button type="submit" class="botao-azul">Entrar</button>

      <p class="rodape-form">
        Ainda não possui uma conta? <a href="cadastro.html">Criar uma conta</a>
      </p>
    </form>
  </main>

</body>
</html>
