<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livraria CLS - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body {
      background-color: #171513;
      color: #f5f2e8;
      min-height: 100vh;
    }


    .caixa {
      background-color: #242220;
      border: 1px solid #383532;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }


    .campo {
      margin-bottom: 18px;
    }

    .campo label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    .campo input, .campo select {
      width: 100%;
      padding: 13px;
      background-color: #171513;
      border: 1px solid #4a4642;
      border-radius: 7px;
      color: #f5f2e8;
      font-size: 14px;
    }

    .campo input:focus {
      border-color: #e0607e;
      outline: none;
    }

    .centro {
      display: flex;
      justify-content: center;
      padding: 60px 20px;
    }

    .form-conta {
      width: 100%;
      max-width: 430px;
    }

    .form-conta h1 {
      text-align: center;
      font-family: Georgia, 'Times New Roman', serif;
      color: #e0607e;
      font-size: 38px;
    }

    .subtitulo {
      text-align: center;
      color: #a9a49c;
      font-size: 14px;
      margin: 10px 0 30px;
    }

    .botao-azul {
      width: 100%;
      padding: 13px;
      background-color: #8b1e3f;
      color: #ffffff;
      border: none;
      border-radius: 7px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .botao-azul:hover {
      background-color: #69122d;
    }

    .mensagem {
      text-align: center;
      margin-top: 15px;
      font-size: 13px;
      min-height: 18px;
    }

    .rodape-form {
      text-align: center;
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #383532;
      color: #a9a49c;
      font-size: 14px;
    }

    .rodape-form a {
      color: #e0607e;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <nav class="cabecalho">
    <div class="logo">CLS</div>
    <ul class="menu">
      <li><a href="index.html">Início</a></li>
      <li><a href="catalogo.html">Catálogo</a></li>
      <li><a href="foruns.html">Fórum</a></li>
      <li><a href="lista.html" class="menu-icone" title="Lista de Desejos">♡</a></li>
      <li><a href="carrinho.html" class="menu-icone" title="Meu Carrinho">🛒</a></li>
      <li><a href="login.html" class="botao-login">Login</a></li>
      <li><a href="cadastro.html" class="botao-cadastro">Cadastrar</a></li>
    </ul>
  </nav>

  <main class="centro">
    <!-- Login de mentira: ao clicar em Entrar vai direto para o perfil -->
    <form action="perfil.html" class="caixa form-conta">
      <h1>LOGIN</h1>
      <p class="subtitulo">Entre na sua conta da Livraria CLS</p>

      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="Digite seu e-mail" required>
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Digite sua senha" required>
      </div>

      <button type="submit" class="botao-azul">Entrar</button>

      <div class="rodape-form">
        Ainda não possui uma conta? <a href="cadastro.html">Criar uma conta</a>
      </div>
    </form>
  </main>


  <!-- VLIBRAS (acessibilidade em Libras) -->
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper><div class="vw-plugin-top-wrapper"></div></div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>new window.VLibras.Widget('https://vlibras.gov.br/app');</script>

</body>
</html>
