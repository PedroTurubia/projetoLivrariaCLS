<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livraria CLS - Checkout</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/checkout.css">
</head>
<body>

  <header class="cabecalho">
    <a href="index.html" class="logo"><img src="./imagem/logo-cls-estante.png" alt="CLS Livraria - página inicial"></a>
    <nav aria-label="Menu principal">
      <ul class="menu">
        <li><a href="index.html">Início</a></li>
        <li><a href="catalogo.html">Catálogo</a></li>
        <li><a href="foruns.html">Fórum</a></li>
        <li><a href="unidades.html">Unidades</a></li>
        <li><a href="lista_desejos.html" title="Lista de Desejos" aria-label="Lista de Desejos">♡</a></li>
        <li><a href="carrinho.html" title="Meu Carrinho"><img src="./imagem/carrinho.png" alt="Meu Carrinho" class="icone-menu"></a></li>
        <li><a href="login.html" class="botao-login">Login</a></li>
        <li><a href="cadastro.html" class="botao-cadastro">Cadastrar</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1 class="visualmente-oculto">Finalizar compra</h1>

    <form action="index.html" class="duas-colunas">
      <div class="caixa">
        <div class="campo">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" autocomplete="name" required>
        </div>

        <fieldset>
          <legend>Contato</legend>
          <div class="lado-a-lado">
            <div class="campo">
              <label for="cpf">CPF</label>
              <input type="text" id="cpf" name="cpf" inputmode="numeric" pattern="[0-9]{11}" maxlength="11"
                     oninput="this.value = this.value.replace(/\D/g, '')"
                     placeholder="Somente 11 números" title="Digite os 11 números do CPF, sem pontos ou hífen." required>
            </div>
            <div class="campo">
              <label for="telefone">Telefone</label>
              <input type="tel" id="telefone" name="telefone" inputmode="numeric" pattern="[0-9]{10,11}" maxlength="11"
                     oninput="this.value = this.value.replace(/\D/g, '')"
                     placeholder="Somente números" title="Digite o telefone com DDD, contendo 10 ou 11 números." autocomplete="tel" required>
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend>Endereço de entrega</legend>
          <div class="campo">
            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" name="cidade" placeholder="Ex: São Paulo" autocomplete="address-level2" required>
          </div>
          <div class="lado-a-lado">
            <div class="campo">
              <label for="cep">CEP</label>
              <input type="text" id="cep" name="cep" inputmode="numeric" pattern="[0-9]{8}" maxlength="8"
                     oninput="this.value = this.value.replace(/\D/g, '')"
                     placeholder="Somente 8 números" title="Digite os 8 números do CEP, sem hífen." autocomplete="postal-code" required>
            </div>
            <div class="campo">
              <label for="estado">Estado</label>
              <select id="estado" name="estado" autocomplete="address-level1" required>
                <option value="" disabled selected>Selecione o estado</option>
                <option>AC</option><option>AL</option><option>AP</option><option>AM</option><option>BA</option>
                <option>CE</option><option>DF</option><option>ES</option><option>GO</option><option>MA</option>
                <option>MT</option><option>MS</option><option>MG</option><option>PA</option><option>PB</option>
                <option>PR</option><option>PE</option><option>PI</option><option>RJ</option><option>RN</option>
                <option>RS</option><option>RO</option><option>RR</option><option>SC</option><option>SP</option>
                <option>SE</option><option>TO</option>
              </select>
            </div>
          </div>
          <div class="campo">
            <label for="endereco">Endereço completo</label>
            <input type="text" id="endereco" name="endereco" placeholder="Ex: Rua das Flores, 123 - Apto 45" autocomplete="street-address" required>
          </div>
        </fieldset>

        <fieldset>
          <legend>Pagamento</legend>
          <div class="campo">
            <label for="pagamento">Forma de pagamento</label>
            <select id="pagamento" name="pagamento" required>
              <option value="" disabled selected>Selecione uma forma de pagamento</option>
              <option value="cartao">Cartão de Crédito</option>
              <option value="pix">PIX (5% de Desconto)</option>
              <option value="boleto">Boleto Bancário</option>
            </select>
          </div>
        </fieldset>
      </div>

      <aside class="caixa">
        <h2>Resumo do Pedido</h2>
        <p class="linha-resumo"><span>Harry Potter...</span><span>R$ 49,99</span></p>
        <p class="linha-resumo"><span>Dom Quixote de La Mancha</span><span>R$ 79,99</span></p>
        <p class="linha-resumo"><span>Frete</span><span>Grátis</span></p>
        <p class="linha-total"><span>Total</span><span>R$ 129,98</span></p>
        <button type="submit" class="botao-finalizar">Finalizar Compra</button>
        <a href="carrinho.html" class="botao-voltar">Voltar ao carrinho</a>
      </aside>
    </form>
  </main>

</body>
</html>
