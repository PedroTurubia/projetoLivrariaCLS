<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livraria CLS - Checkout</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/checkout.css">
</head>
<body>

  <nav class="cabecalho">
    <figure class="logo"><img src="imagem/logo-cls-estante.png" alt="CLS Livraria"></figure>
    <ul class="menu">
      <li><a href="index.html">Início</a></li>
      <li><a href="catalogo.html">Catálogo</a></li>
      <li><a href="foruns.html">Fórum</a></li>
      <li><a href="unidades.html">Unidades</a></li>
      <li><a href="lista_desejos.html" title="Lista de Desejos">♡</a></li>
      <li><a href="carrinho.html" title="Meu Carrinho"><img src="imagem/carrinho.png" alt="Meu Carrinho" class="icone-menu"></a></li>
      <li><a href="login.html" class="botao-login">Login</a></li>
      <li><a href="cadastro.html" class="botao-cadastro">Cadastrar</a></li>
    </ul>
  </nav>

<br>
<br>


<form action="index.html" class="duas-colunas">
    <section class="caixa" aria-label="Dados para a compra">
        <div class="campo">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" autocomplete="name" required>
        </div>
            <section class="grupo-campos">
              <h3>Contato</h3>
            </section>
            <div class="lado-a-lado">
                <div class="campo">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" name="cpf" inputmode="numeric" pattern="[0-9]{11}"
                     maxlength="11" placeholder="Somente 11 números" title="Digite os 11 números do CPF, sem pontos ou hífen." required >
                </div>
                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" name="telefone" inputmode="numeric" pattern="[0-9]{10,11}" maxlength="11"
                      placeholder="Somente números" title="Digite o telefone com DDD, contendo 10 ou 11 números." autocomplete="tel" required >
                </div>
            </div>
            <section class="grupo-campos">
             <h3>Endereço de entrega</h3>
            </section>
            <div class="campo">
                <label for="cidade">Cidade</label>
                <input
                 type="text" id="cidade" name="cidade" placeholder="Ex: São Paulo" autocomplete="address-level2" required>
            </div>
            <div class="lado-a-lado">
                <div class="campo">
                    <label for="cep">CEP</label>
                    <input type="text" id="cep" name="cep" inputmode="numeric" pattern="[0-9]{8}" maxlength="8"
                    placeholder="Somente 8 números" title="Digite os 8 números do CEP, sem hífen." autocomplete="postal-code" required >
                </div>
                <div class="campo">
                    <label for="estado">Estado</label>
                    <select id="estado" name="estado" required>
                      <option value="" disabled selected>  Selecione o estado </option>
                      <option value="AC">AC</option>
                      <option value="AL">AL</option>
                      <option value="AP">AP</option>
                      <option value="AM">AM</option>
                      <option value="BA">BA</option>
                      <option value="CE">CE</option>
                      <option value="DF">DF</option>
                      <option value="ES">ES</option>
                      <option value="GO">GO</option>
                      <option value="MA">MA</option>
                      <option value="MT">MT</option>
                      <option value="MS">MS</option>
                      <option value="MG">MG</option>
                      <option value="PA">PA</option>
                      <option value="PB">PB</option>
                      <option value="PR">PR</option>
                      <option value="PE">PE</option>
                      <option value="PI">PI</option>
                      <option value="RJ">RJ</option>
                      <option value="RN">RN</option>
                      <option value="RS">RS</option>
                      <option value="RO">RO</option>
                      <option value="RR">RR</option>
                      <option value="SC">SC</option>
                      <option value="SP">SP</option>
                      <option value="SE">SE</option>
                      <option value="TO">TO</option>
                    </select>
                </div>
            </div>
            <div class="campo">
                <label for="endereco">Endereço completo</label>
                <inputtype="text" id="endereco" name="endereco"
                placeholder="Ex: Rua das Flores, 123 - Apto 45" autocomplete="street-address" required>
            </div>
    </section>
      <section class="grupo-campos">
        <h3>Pagamento</h3>
        <div class="campo">
         <label for="pagamento">Forma de pagamento</label>
          <select id="pagamento" name="pagamento" required>
            <option value="" disabled selected>Selecione uma forma de pagamento</option>
            <option value="cartao">Cartão de Crédito</option>
            <option value="pix">PIX (5% de Desconto)</option>
            <option value="boleto">Boleto Bancário</option>
          </select>
        </div>
      </section>
    </section>
    <aside class="caixa">
        <h2>Resumo do Pedido</h2>
       <div>
            <div class="linha-resumo">
                <span>Harry Potter...</span>
                <span>R$ 49,99</span>
            </div>
            <div class="linha-resumo">
                <span>Dom Quixote de La Mancha</span>
                <span>R$ 79,99</span>
            </div>
        </div>
        <div class="linha-resumo">
            <span>Frete</span>
            <span>Grátis</span>
        </div>
        <div class="linha-total">
            <span>Total</span>
            <span>R$ 129,98</span>
        </div>
        <button type="submit" class="botao-finalizar">Finalizar Compra</button>
        <a href="carrinho.html" class="botao-voltar"> Voltar ao carrinho</a>
    </aside>
</form>


</body>
</html>
