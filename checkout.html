<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livraria CLS - Checkout</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/checkout.css">
</head>
<body>

  <nav class="cabecalho">
    <div class="logo"><img src="../imagem/logo-cls-estante.png" alt="CLS Livraria"></div>
    <ul class="menu">
      <li><a href="index.html">Início</a></li>
      <li><a href="catalogo.html">Catálogo</a></li>
      <li><a href="foruns.html">Fórum</a></li>
      <li><a href="unidades.html">Unidades</a></li>
      <li><a href="lista_desejos.html" title="Lista de Desejos">♡</a></li>
      <li><a href="carrinho.html" title="Meu Carrinho"><img src="../imagem/carrinho.png" alt="Meu Carrinho" class="icone-menu"></a></li>
      <li><a href="login.html" class="botao-login">Login</a></li>
      <li><a href="cadastro.html" class="botao-cadastro">Cadastrar</a></li>
    </ul>
  </nav>

<br>
<br>
  <form action="index.html" class="duas-colunas">
    <div class="caixa">
      <div class="campo">
        <label>Nome Completo</label>
        <input type="text" placeholder="Digite seu nome completo" required>
      </div>
      <div class="lado-a-lado">
        <div class="campo"><label>CPF</label><input type="text" placeholder="000.000.000-00" required></div>
        <div class="campo"><label>Telefone</label><input type="tel" placeholder="(00) 00000-0000" required></div>
      </div>

      <div class="campo">
      <label>Cidade</label>
      <input type="text" placeholder="Ex: São Paulo" required>  
      </div>

    <div class="caixa-espaco"></div>
      <div class="lado-a-lado">
        <div class="campo"><label>CEP</label><input type="text" placeholder="00000-000" required></div>
        <div class="campo"><label>Estado</label>
         <select required>
           <option value="" disabled selected>Selecione o estado</option>
              <option>AC</option>
    <option>AL</option>
    <option>AP</option>
    <option>AM</option>
    <option>BA</option>
    <option>CE</option>
    <option>DF</option>
    <option>ES</option>
    <option>GO</option>
    <option>MA</option>
    <option>MT</option>
    <option>MS</option>
    <option>MG</option>
    <option>PA</option>
    <option>PB</option>
    <option>PR</option>
    <option>PE</option>
    <option>PI</option>
    <option>RJ</option>
    <option>RN</option>
    <option>RS</option>
    <option>RO</option>
    <option>RR</option>
    <option>SC</option>
    <option>SP</option>
    <option>SE</option>
    <option>TO</option>
         </select> 
        </div>
      </div>
      <div class="campo">
        <label>Endereço Completo </label>
        <input type="text" placeholder="Ex: Rua das Flores, 123 - Apto 45" required>
      </div>

    <div class="caixa-espaco-2"></div>
      <div class="campo">
        <select required>
          <option value="" disabled selected>Selecione uma forma de pagamento</option>
          <option>Cartão de Crédito</option>
          <option>PIX (5% de Desconto)</option>
          <option>Boleto Bancário</option>
        </select>
      </div>
    </div>

    <aside class="caixa">
      <h2>Resumo do Pedido</h2>
      <div>
        <div class="linha-resumo"><span>Harry Potter...</span><span>R$ 49,99</span></div>
        <div class="linha-resumo"><span>Dom Quixote De La Mancha</span><span>R$ 79,99</span></div>
      </div>
      <div class="linha-resumo"><span>Frete</span><span>Grátis</span></div>
      <div class="linha-total"><span>Total</span><span>R$ 129,98</span></div>
      <button type="submit" class="botao-finalizar">Finalizar Compra</button>
      <a href="carrinho.html" class="botao-voltar">Voltar ao carrinho</a>
    </aside>
</form>

</body>
</html>
